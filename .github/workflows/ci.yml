name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run unit and MySQL integration tests
        working-directory: backend
        run: mvn --batch-mode verify

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Build AngularJS frontend
        working-directory: frontend
        run: npm run build

  production-images:
    name: Production container builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t itsm-backend:ci backend
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t itsm-frontend:ci frontend
