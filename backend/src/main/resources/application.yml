spring:
  application:
    name: it-service-desk
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/it_service_desk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:itsm_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLE:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@example.test}
    support-email: ${SUPPORT_EMAIL:}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  sla:
    # Calendar-time targets; the UI and reports use these same values.
    targets:
      urgent: { first-response-minutes: 60, resolution-minutes: 240 }
      high: { first-response-minutes: 240, resolution-minutes: 1440 }
      normal: { first-response-minutes: 480, resolution-minutes: 4320 }
      low: { first-response-minutes: 1440, resolution-minutes: 7200 }
  ticket-upload-dir: ${TICKET_UPLOAD_DIR:./var/uploads/tickets}
  asset-upload-dir: ${ASSET_UPLOAD_DIR:./var/uploads/assets}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
